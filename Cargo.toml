[package]
name = "rusync2"
version = "0.8.0"
authors = ["Dimitri Merejkowsky <dimitri@dmerej.info>", "Raibows <lukcychizuo@gmail.com>"]

readme = "README.md"
description = "Maintained fork of rusync: adds --include/--exclude filters and a --sleep-interval watch mode"
license = "BSD-3-Clause"

keywords = ["rsync"]
categories = ["command-line-utilities"]

repository = "https://github.com/Raibows/rusync2"

edition = "2021"

# The library keeps the original `rusync` name:
[lib]
name = "rusync"

[dependencies]
anyhow = "1.0.58"
chrono = "0.4.45"
clap = {version = "3.2.8", features = ["derive"] }
colored = "2.0.0"
filetime = "0.2.17"
humansize = "1.1.1"
humantime = "2.1.0"
pathdiff = "0.2.1"
regex = "1.13.1"
terminal_size = "0.2.1"

[dev-dependencies]
tempfile = "3.3.0"
